baseURL = "https://theorycrafting.life/"
enableRobotsTXT = true
languageCode = "en-us"
title = "Theorycrafting.life"
#theme = ""
[pagination]
  pagerSize = 10

[params]
  description = "Optimizing systems, stories, and self."
  author = "James Thompson"
  brand_color = "#d4af37" # gold
  dark_bg = "#0b0d10"
  light_text = "#e6e6e6"
  summaryLength = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
    [markup.goldmark.renderer]
      unsafe = true

[mediaTypes]
  [mediaTypes."text/vcard"]
    suffixes = ["vcf"]

[outputFormats]
  [outputFormats.vcard]
    mediaType = "text/vcard"
    baseName = "index"
    isPlainText = true
    isHTML = false
    notAlternative = true
