<!DOCTYPE html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if eq .Type "contact" }}contact-page{{ else }}site-page{{ end }}">
  {{ if ne .Type "contact" }}
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="site-shell">
      {{ partial "banner.html" (dict "links" true "tagline" .Site.Params.description "Site" .Site "Page" .) }}
      <main id="main-content">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
  {{ else }}
    {{ block "main" . }}{{ end }}
  {{ end }}
</body>
</html>
